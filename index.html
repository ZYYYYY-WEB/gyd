<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧本杀邀请</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", serif;
        }
        body {
            background: linear-gradient(145deg, #0f0f1e, #1b1b35);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 40%, rgba(233, 69, 96, 0.12), transparent 60%);
            animation: slowGlow 8s ease-in-out infinite alternate;
        }
        @keyframes slowGlow {
            from {opacity:0.4;}
            to {opacity:0.9;}
        }
        .card {
            background: rgba(22, 33, 62, 0.85);
            backdrop-filter: blur(8px);
            padding: 52px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 40px rgba(233, 69, 96, 0.25);
            max-width: 440px;
            width: 92%;
            border: 1px solid rgba(233, 69, 96, 0.2);
            position: relative;
            z-index: 2;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 20px;
            color: #e94560;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .tip {
            font-size: 18px;
            margin-bottom: 42px;
            color: #cbd5e1;
            line-height:1.6;
        }
        .btn-group {
            display: flex;
            gap:24px;
            justify-content: center;
        }
        button {
            padding:15px 36px;
            border-radius: 12px;
            border: none;
            font-size:19px;
            transition: all 0.3s ease;
        }
        #joinBtn {
            background-color: #e94560;
            color:white;
            box-shadow: 0 4px 14px rgba(233, 69, 96,0.4);
            cursor: pointer;
        }
        #joinBtn:hover{
            background-color:#c7384f;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(233, 69, 96,0.5);
        }
        #refuseBtn {
            background-color:#333644;
            color:#777;
            cursor: not-allowed;
        }
        .success-box{
            display:none;
        }
        .success-box h2{
            color:#4ade80;
            font-size:28px;
            margin-bottom:20px;
        }
        .success-box p{
            color:#cbd5e1;
            font-size:17px;
            line-height:1.7;
        }
        @keyframes fadeIn {
            from {opacity:0; transform: scale(0.92);}
            to {opacity:1; transform: scale(1);}
        }
        .show-animate{
            animation: fadeIn 0.6s ease forwards;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="invite-box" id="inviteBox">
            <h1>安当·高堰铎，请加入我们</h1>
            <p class="tip">剧本杀车队等候你的到来<br>一场悬疑故事即将开启</p >
            <div class="btn-group">
                <button id="joinBtn">加入</button>
                <button id="refuseBtn" disabled>不加入</button>
            </div>
        </div>
        <div class="success-box" id="successBox">
            <h2>加入成功！欢迎加入🎉</h2>
            <p>剧本杀车队已就位，期待一起盘本，揭开故事真相！</p >
        </div>
    </div>

    <script>
        const joinBtn = document.getElementById('joinBtn');
        const inviteBox = document.getElementById('inviteBox');
        const successBox = document.getElementById('successBox');
        joinBtn.onclick = function(){
            inviteBox.style.display = "none";
            successBox.style.display = "block";
            successBox.classList.add('show-animate');
        }
    </script>
</body>
</html>
